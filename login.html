<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Porra Champions · Entrar</title>
<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#070b18">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="G.H. Champions">
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070b18; --bg2:#0b1024; --panel:#121a34; --panel2:#19224a;
    --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
    --text:#eef1fb; --muted:#8890b4; --faint:#5a628a;
    --gold:#f4b740; --gold-dim:#b9871f; --cyan:#74e4ff;
    --ok:#37d67a; --err:#f0555f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:
      radial-gradient(120% 45% at 50% -5%, rgba(116,228,255,.14), transparent 60%),
      radial-gradient(90% 40% at 85% 0%, rgba(244,183,64,.10), transparent 55%),
      linear-gradient(180deg,var(--bg2),var(--bg) 45%);
    color:var(--text);font-family:Inter,system-ui,sans-serif}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}

  .card{width:100%;max-width:400px}
  .brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:22px;text-align:center}
  .starball{width:54px;height:54px}
  .kicker{font-family:Oswald;font-weight:600;letter-spacing:.14em;font-size:11px;color:var(--cyan);text-transform:uppercase;opacity:.85}
  .title{font-family:Oswald;font-weight:700;font-size:30px;line-height:.95;text-transform:uppercase;margin-top:-2px}
  .title b{color:var(--gold)}

  .box{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
    border-radius:18px;padding:20px 18px;box-shadow:0 24px 50px -24px rgba(0,0,0,.8)}

  .seg{display:flex;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:18px}
  .seg button{flex:1;font-family:Oswald;font-weight:600;font-size:13px;letter-spacing:.05em;text-transform:uppercase;
    padding:9px;border:none;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;transition:.2s}
  .seg button.on{background:linear-gradient(180deg,var(--gold),var(--gold-dim));color:#150f00}

  .field{margin-bottom:13px}
  .field label{display:block;font-family:Oswald;font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 6px 2px}
  .field input{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:11px;color:var(--text);
    font-family:Inter;font-size:15px;padding:12px 13px;transition:.18s}
  .field input:focus{outline:none;border-color:var(--gold);background:rgba(244,183,64,.05)}
  .field input::placeholder{color:var(--faint)}

  .btn{width:100%;font-family:Oswald;font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase;
    padding:14px;border-radius:12px;border:none;cursor:pointer;margin-top:6px;
    background:linear-gradient(180deg,var(--gold),var(--gold-dim));color:#150f00;box-shadow:0 8px 20px -8px rgba(244,183,64,.6);transition:.2s}
  .btn:disabled{opacity:.6;cursor:not-allowed;box-shadow:none}

  .msg{margin-top:14px;font-size:13px;line-height:1.4;padding:11px 13px;border-radius:11px;display:none}
  .msg.show{display:block}
  .msg.err{background:rgba(240,85,95,.12);border:1px solid rgba(240,85,95,.4);color:#ffb3b7}
  .msg.ok{background:rgba(55,214,122,.12);border:1px solid rgba(55,214,122,.4);color:#a7edc6}

  .foot{text-align:center;margin-top:16px}
  .foot a{color:var(--muted);font-size:12.5px;text-decoration:none;border-bottom:1px dotted var(--faint);cursor:pointer}
  .foot a:hover{color:var(--gold);border-color:var(--gold)}
  .hint{text-align:center;color:var(--faint);font-size:11.5px;margin-top:18px;line-height:1.4}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <svg class="starball" viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="18" fill="#0e1530" stroke="#2a355f"/>
        <path d="M20 7l2.6 5.3 5.9.9-4.3 4.1 1 5.8L20 26l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z" fill="#f4b740"/>
        <circle cx="20" cy="20" r="18" stroke="#74e4ff" stroke-opacity=".25"/>
      </svg>
      <div>
        <div class="kicker">Liga de Campeones · 2026/27</div>
        <div class="title">Porra <b>Champions</b></div>
      </div>
    </div>

    <div class="box">
      <div class="seg">
        <button id="tabLogin" class="on">Entrar</button>
        <button id="tabSignup">Crear cuenta</button>
      </div>

      <div class="field" id="fieldNombre" style="display:none">
        <label for="nombre">Nombre</label>
        <input id="nombre" type="text" autocomplete="name" placeholder="Cómo saldrás en el ranking">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="tu@email.com">
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="Mínimo 6 caracteres">
      </div>

      <button class="btn" id="submitBtn">Entrar</button>
      <div class="msg" id="msg"></div>

      <div class="foot">
        <a id="forgot">¿Olvidaste tu contraseña?</a>
      </div>
    </div>

    <div class="hint">Al entrar aceptas participar en la porra entre amigos.<br>Tus pronósticos solo los puedes editar tú.</div>
  </div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

  // --- Config ---
  const SUPABASE_URL = 'https://vucyzvyohltyontitcfr.supabase.co'
  const SUPABASE_KEY = 'sb_publishable_i_RtEH-_kVhcJcoTsyVfkA_xxWrkmzd'
  const APP_URL      = 'porra-champions.html'   // a dónde ir tras iniciar sesión

  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

  // --- Elementos ---
  const tabLogin = document.getElementById('tabLogin')
  const tabSignup = document.getElementById('tabSignup')
  const fieldNombre = document.getElementById('fieldNombre')
  const nombre = document.getElementById('nombre')
  const email = document.getElementById('email')
  const password = document.getElementById('password')
  const submitBtn = document.getElementById('submitBtn')
  const msg = document.getElementById('msg')
  const forgot = document.getElementById('forgot')

  let mode = 'login' // 'login' | 'signup'

  function setMsg(text, kind){ msg.textContent = text; msg.className = 'msg show ' + kind }
  function clearMsg(){ msg.className = 'msg' }

  function setMode(m){
    mode = m
    const isSignup = m === 'signup'
    tabLogin.classList.toggle('on', !isSignup)
    tabSignup.classList.toggle('on', isSignup)
    fieldNombre.style.display = isSignup ? 'block' : 'none'
    password.setAttribute('autocomplete', isSignup ? 'new-password' : 'current-password')
    submitBtn.textContent = isSignup ? 'Crear cuenta' : 'Entrar'
    clearMsg()
  }
  tabLogin.onclick = () => setMode('login')
  tabSignup.onclick = () => setMode('signup')

  // Si ya hay sesión, directo a la app
  const { data: { session } } = await supabase.auth.getSession()
  if (session) location.replace(APP_URL)

  async function handleSubmit(){
    clearMsg()
    const em = email.value.trim()
    const pw = password.value

    if (!em || !pw){ setMsg('Rellena email y contraseña.', 'err'); return }
    if (mode === 'signup' && !nombre.value.trim()){ setMsg('Pon un nombre para el ranking.', 'err'); return }
    if (pw.length < 6){ setMsg('La contraseña debe tener al menos 6 caracteres.', 'err'); return }

    submitBtn.disabled = true
    submitBtn.textContent = 'Un momento…'

    try {
      if (mode === 'login'){
        const { error } = await supabase.auth.signInWithPassword({ email: em, password: pw })
        if (error) throw error
        location.replace(APP_URL)
      } else {
        const { data, error } = await supabase.auth.signUp({
          email: em, password: pw,
          options: { data: { nombre: nombre.value.trim() } }
        })
        if (error) throw error
        // Usuario ya existente: Supabase devuelve user con identities vacías
        if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0){
          setMsg('Ya existe una cuenta con ese email. Prueba a entrar.', 'err')
        } else if (data.session){
          location.replace(APP_URL)               // confirmación de email desactivada → dentro
        } else {
          setMsg('Cuenta creada. Revisa tu email para confirmarla y luego entra.', 'ok')
          setMode('login')
        }
      }
    } catch (e){
      const m = (e && e.message) ? e.message : 'Algo ha ido mal.'
      if (/invalid login credentials/i.test(m)) setMsg('Email o contraseña incorrectos.', 'err')
      else if (/already registered/i.test(m))   setMsg('Ese email ya está registrado.', 'err')
      else setMsg(m, 'err')
    } finally {
      submitBtn.disabled = false
      submitBtn.textContent = mode === 'signup' ? 'Crear cuenta' : 'Entrar'
    }
  }
  submitBtn.onclick = handleSubmit
  password.addEventListener('keydown', e => { if (e.key === 'Enter') handleSubmit() })

  forgot.onclick = async () => {
    const em = email.value.trim()
    if (!em){ setMsg('Escribe tu email arriba y vuelve a pulsar aquí.', 'err'); return }
    const { error } = await supabase.auth.resetPasswordForEmail(em, { redirectTo: new URL('login.html', location.href).href })
    if (error) setMsg(error.message, 'err')
    else setMsg('Te hemos enviado un email para restablecer la contraseña.', 'ok')
  }
</script>
</body>
</html>
