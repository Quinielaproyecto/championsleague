<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Porra Champions · Inicio</title>
<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#070b18">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="G.H. Champions">
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070b18; --bg2:#0b1024; --panel:#121a34; --panel2:#19224a;
    --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
    --text:#eef1fb; --muted:#8890b4; --faint:#5a628a;
    --gold:#f4b740; --gold-dim:#b9871f; --cyan:#74e4ff;
    --dir:#37d67a; --po:#ff9f43; --err:#f0555f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:
      radial-gradient(120% 45% at 50% -5%, rgba(116,228,255,.14), transparent 60%),
      radial-gradient(90% 40% at 85% 0%, rgba(244,183,64,.10), transparent 55%),
      linear-gradient(180deg,var(--bg2),var(--bg) 45%);
    color:var(--text);font-family:Inter,system-ui,sans-serif}
  body{min-height:100vh;padding:16px 14px 92px}
  .wrap{max-width:520px;margin:0 auto}

  header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .starball{width:26px;height:26px;flex:0 0 auto}
  .htitle{font-family:Oswald;font-weight:700;font-size:17px;text-transform:uppercase;line-height:1}
  .htitle b{color:var(--gold)}
  .userchip{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;background:transparent;border:none;cursor:pointer;padding:2px 0}
  .userchip .un{font-family:Oswald;font-weight:600;font-size:12.5px;color:var(--text)}
  .userchip .out{font-size:10px;color:var(--faint);letter-spacing:.05em;text-transform:uppercase}
  .userchip:hover .out{color:var(--gold)}

  .hero{background:radial-gradient(120% 100% at 50% 0%,rgba(244,183,64,.16),transparent 70%),var(--panel2);
    border:1px solid rgba(244,183,64,.3);border-radius:18px;padding:18px;text-align:center;margin-bottom:14px}
  .hero .hi{font-size:13px;color:var(--muted)}
  .hero .hi b{color:var(--text)}
  .hero .tot{font-family:Oswald;font-weight:700;font-size:46px;color:var(--gold);line-height:1;margin:6px 0 2px;font-variant-numeric:tabular-nums}
  .hero .totlbl{font-family:Oswald;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .hero .rankpill{display:inline-block;margin-top:10px;font-family:Oswald;font-weight:600;font-size:12px;letter-spacing:.04em;
    background:rgba(255,255,255,.06);border:1px solid var(--line2);border-radius:20px;padding:5px 13px}
  .hero .rankpill b{color:var(--gold)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .card h2{font-family:Oswald;font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin:0 0 12px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .card h2 .dot{width:7px;height:7px;border-radius:50%}

  .phases{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .ph{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:9px 4px;text-align:center}
  .ph .pv{font-family:Oswald;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
  .ph .pl{font-family:Oswald;font-size:9px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);margin-top:2px}
  .ph.g .pv{color:var(--dir)} .ph.p .pv{color:var(--po)} .ph.e .pv{color:var(--cyan)} .ph.f .pv{color:var(--gold)}

  .leader{display:flex;align-items:center;gap:12px}
  .leader .crown{font-size:22px}
  .leader .lnm{font-family:Oswald;font-weight:700;font-size:18px}
  .leader .lsub{font-size:11.5px;color:var(--muted)}
  .leader .lt{margin-left:auto;text-align:right}
  .leader .lt .v{font-family:Oswald;font-weight:700;font-size:26px;color:var(--gold);font-variant-numeric:tabular-nums}
  .leader .lt .l{font-family:Oswald;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .lbreak{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
  .lbreak div{text-align:center;font-size:11px;color:var(--muted)}
  .lbreak div b{display:block;font-family:Oswald;font-size:14px;color:var(--text);font-variant-numeric:tabular-nums}
  .mefirst{margin-top:10px;text-align:center;font-family:Oswald;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--gold)}

  .state .srow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
  .state .srow:first-child{border-top:none}
  .state .srow .nm{flex:1;font-weight:600}
  .state .tag{font-family:Oswald;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:4px 10px;border-radius:20px}
  .tag.abierta{background:rgba(55,214,122,.15);color:var(--dir)}
  .tag.cerrada{background:rgba(240,85,95,.14);color:#ffb3b7}
  .tag.pendiente{background:rgba(136,144,180,.14);color:var(--muted)}

  .quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .quick a{display:flex;flex-direction:column;gap:4px;text-decoration:none;background:var(--panel2);border:1px solid var(--line2);
    border-radius:13px;padding:14px;color:var(--text);transition:.2s}
  .quick a:hover{border-color:var(--gold)}
  .quick a .qt{font-family:Oswald;font-weight:600;font-size:14px;letter-spacing:.03em}
  .quick a .qd{font-size:11.5px;color:var(--muted)}
  .quick a.admin{grid-column:1 / -1;background:transparent}

  .soon{font-size:12.5px;color:var(--faint);text-align:center;padding:6px 0}
  .center-note{max-width:520px;margin:70px auto;text-align:center;color:var(--muted);line-height:1.5}
  .center-note a{color:var(--gold)}

  /* footer común */
  .appfoot{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;gap:2px;
    background:rgba(6,10,22,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
  .appfoot a{flex:1;max-width:130px;display:flex;flex-direction:column;align-items:center;gap:3px;
    text-decoration:none;color:var(--faint);padding:5px 2px;transition:.2s}
  .appfoot a svg{width:21px;height:21px}
  .appfoot a span{font-family:Oswald;font-size:10px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
  .appfoot a.on{color:var(--gold)} .appfoot a:hover{color:var(--muted)} .appfoot a.on:hover{color:var(--gold)}
</style>
</head>
<body>
<div class="wrap" id="wrap" style="display:none">
  <header>
    <svg class="starball" viewBox="0 0 40 40" fill="none">
      <circle cx="20" cy="20" r="18" fill="#0e1530" stroke="#2a355f"/>
      <path d="M20 7l2.6 5.3 5.9.9-4.3 4.1 1 5.8L20 26l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z" fill="#f4b740"/>
    </svg>
    <div class="htitle">Porra <b>Champions</b></div>
    <button class="userchip" id="userChip"><span class="un" id="uName"></span><span class="out">Salir</span></button>
  </header>

  <div id="content"></div>
</div>

<div class="center-note" id="gate">Cargando…</div>

<nav class="appfoot">
  <a data-page="home" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span>Home</span></a>
  <a data-page="pron" href="porra-champions.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="16" rx="2"/><path d="M9.5 4h5v2.5h-5z"/><path d="M9 11h6M9 15h4"/></svg><span>Mi pronóstico</span></a>
  <a data-page="clas" href="resultados.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v4a5 5 0 01-10 0z"/><path d="M7 6H4v1.5a3 3 0 003 3M17 6h3v1.5a3 3 0 01-3 3"/><path d="M9.5 20h5M12 14v6"/></svg><span>Clasificación</span></a>
  <a data-page="admin" href="admin.html" class="adminonly" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M3 12h2M19 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Admin</span></a>
</nav>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
  const SUPABASE_URL = 'https://vucyzvyohltyontitcfr.supabase.co'
  const SUPABASE_KEY = 'sb_publishable_i_RtEH-_kVhcJcoTsyVfkA_xxWrkmzd'
  const sb = createClient(SUPABASE_URL, SUPABASE_KEY)
  const $ = id => document.getElementById(id)
  const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))

  const { data:{ session } } = await sb.auth.getSession()
  if(!session){ location.replace('login.html') }
  else { await cargar(session) }

  $('userChip').onclick = async () => { await sb.auth.signOut(); location.replace('login.html') }
  document.querySelectorAll('.appfoot a').forEach(a=>a.classList.toggle('on', a.dataset.page==='home'))

  async function cargar(session){
    const uid = session.user.id
    const [ prof, punt, cfg ] = await Promise.all([
      sb.from('profiles').select('nombre,es_admin').eq('id',uid).single(),
      sb.from('puntuaciones').select('user_id,nombre,total,r1_grupos,r2_playoff,r3_elim,r4_pos').order('total',{ascending:false}),
      sb.from('config_torneo').select('ventana_gp,ventana_elim').eq('id',1).single()
    ])
    const nombre = (prof.data && prof.data.nombre) || (session.user.email||'').split('@')[0]
    $('uName').textContent = nombre
    if(prof.data && prof.data.es_admin){ const el=document.querySelector('.appfoot .adminonly'); if(el) el.style.display='flex' }

    const rows = punt.data || []
    const cfgd = cfg.data || {ventana_gp:'—',ventana_elim:'—'}
    $('gate').style.display='none'; $('wrap').style.display='block'
    render(uid, nombre, rows, cfgd, prof.data && prof.data.es_admin)
  }

  function statTag(v){ return `<span class="tag ${v}">${v}</span>` }

  function render(uid, nombre, rows, cfg, isAdmin){
    const me = rows.find(r=>r.user_id===uid)
    const myRank = me ? rows.findIndex(r=>r.user_id===uid)+1 : null
    const leader = rows[0] || null
    const soyLider = leader && me && leader.user_id===uid

    const hero = `
      <div class="hero">
        <div class="hi">Hola, <b>${esc(nombre)}</b></div>
        <div class="tot">${me? me.total : 0}</div>
        <div class="totlbl">Puntos totales</div>
        ${myRank? `<div class="rankpill">Vas <b>${myRank}º</b> de ${rows.length}</div>` : `<div class="rankpill">Aún sin puntuar</div>`}
      </div>`

    const misfases = `
      <div class="card">
        <h2><span class="dot" style="background:var(--gold)"></span>Tus puntos por fase</h2>
        <div class="phases">
          <div class="ph g"><div class="pv">${me?me.r1_grupos:0}</div><div class="pl">Grupos</div></div>
          <div class="ph p"><div class="pv">${me?me.r2_playoff:0}</div><div class="pl">Playoff</div></div>
          <div class="ph e"><div class="pv">${me?me.r3_elim:0}</div><div class="pl">Elim.</div></div>
          <div class="ph f"><div class="pv">${me?me.r4_pos:0}</div><div class="pl">Posición</div></div>
        </div>
      </div>`

    const lider = leader ? `
      <div class="card">
        <h2><span class="dot" style="background:var(--gold)"></span>Líder actual</h2>
        <div class="leader">
          <span class="crown">👑</span>
          <div><div class="lnm">${esc(leader.nombre||'—')}</div><div class="lsub">al frente de la porra</div></div>
          <div class="lt"><div class="v">${leader.total}</div><div class="l">puntos</div></div>
        </div>
        <div class="lbreak">
          <div><b>${leader.r1_grupos}</b>Grupos</div>
          <div><b>${leader.r2_playoff}</b>Playoff</div>
          <div><b>${leader.r3_elim}</b>Elim.</div>
          <div><b>${leader.r4_pos}</b>Posición</div>
        </div>
        ${soyLider? `<div class="mefirst">★ ¡Eres tú! Vas primero ★</div>`:''}
      </div>` : `
      <div class="card"><h2><span class="dot" style="background:var(--gold)"></span>Líder actual</h2>
        <div class="soon">Todavía no hay puntuaciones. Cuando el admin recalcule, aparecerá aquí.</div></div>`

    const estado = `
      <div class="card state">
        <h2><span class="dot" style="background:var(--cyan)"></span>Estado de la porra</h2>
        <div class="srow"><span class="nm">Grupos + Playoff</span>${statTag(cfg.ventana_gp)}</div>
        <div class="srow"><span class="nm">Eliminatorias</span>${statTag(cfg.ventana_elim)}</div>
      </div>`

    const quick = `
      <div class="card">
        <h2><span class="dot" style="background:var(--dir)"></span>Accesos</h2>
        <div class="quick">
          <a href="porra-champions.html"><span class="qt">Mi pronóstico</span><span class="qd">Edita tus apuestas</span></a>
          <a href="resultados.html"><span class="qt">Clasificación</span><span class="qd">Tabla y puntos</span></a>
          ${isAdmin? `<a class="admin" href="admin.html"><span class="qt">⚙ Administración</span><span class="qd">Resultados, ventanas y recálculo</span></a>`:''}
        </div>
      </div>`

    const soon = `<div class="card"><h2><span class="dot" style="background:var(--po)"></span>Próximos partidos</h2><div class="soon">Próximamente 🗓️</div></div>`

    $('content').innerHTML = hero + misfases + lider + estado + quick + soon
  }
</script>
</body>
</html>
